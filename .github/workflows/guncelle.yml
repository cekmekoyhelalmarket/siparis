name: Ürünleri güncelle ve yayınla

on:
  schedule:
    - cron: "7 * * * *"      # her saat başı (UTC, 7. dakikada)
  workflow_dispatch:          # elle çalıştırma butonu
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketler
        run: pip install requests beautifulsoup4

      - name: Ürünleri çek
        continue-on-error: true      # site geçici olarak erişilemezse son veriyle yayına devam et
        run: python scraper.py

      - name: Değişiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain public/data.json)" ]; then
            git config user.name "katalog-bot"
            git config user.email "katalog-bot@users.noreply.github.com"
            git add public/data.json
            git commit -m "Ürün listesi güncellendi"
            git push
          else
            echo "Değişiklik yok"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
